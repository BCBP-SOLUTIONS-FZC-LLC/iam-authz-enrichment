# Reusable workflow — test gate. Race detector (unit + integration) +
# coverage, e2e (real compiled binary over real gRPC), arch-lint.
# Called by ci.yml and release.yml so both share exactly one definition of
# "tests pass" — this split only started earning its keep once release.yml
# existed as a second caller.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (leave empty to use the caller ref)"
        type: string
        required: false
        default: ""
    outputs:
      pct:
        description: "Total statement coverage percentage"
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:4.4.0
        ports: ["4566:4566"]
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: ap-south-1
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Init LocalStack queues
        run: |
          chmod +x scripts/init-localstack.sh
          AWS_ACCESS_KEY_ID=localstack AWS_SECRET_ACCESS_KEY=localstack AWS_DEFAULT_REGION=ap-south-1 \
            ./scripts/init-localstack.sh
        env:
          AWS_ENDPOINT_URL: http://localhost:4566

      # Step 2: unit + integration tests (race + coverage)
      - name: Unit tests (race + coverage)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: make test-ci

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          VALKEY_URL: localhost:6379
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: ap-south-1
        run: make test-integration

      # Step 3: e2e — real compiled binary over real gRPC
      - name: Build binary (e2e)
        run: make build

      - name: E2E tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          E2E_BINARY_PATH: ${{ github.workspace }}/bin/iam-authz-enrichment
          VALKEY_URL: localhost:6379
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: ap-south-1
        run: make test-e2e

      # Step 4: coverage threshold gate (≥ 95%)
      - name: Coverage gate (95%)
        id: coverage
        run: bash .github/scripts/coverage-gate.sh
        env:
          COVERAGE_THRESHOLD: "95"

      # Step 5: upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 30

      # Step 6: cache go-arch-lint binary
      - name: Cache go-arch-lint
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin/go-arch-lint
          key: go-arch-lint-${{ runner.os }}-v1.15.0

      # Step 7: architecture lint
      - name: Architecture lint
        run: bash .github/scripts/arch-lint.sh
