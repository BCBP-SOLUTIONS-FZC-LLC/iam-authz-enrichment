# Reusable workflow — test gate.
# Race detector (unit + integration) + coverage gate (100%) + e2e
# (real compiled binary over real gRPC against real Valkey/LocalStack).
# All three tiers run in a single job against shared service containers —
# the same pattern iam-tender-acl uses for its unit + integration + e2e
# tiers. This avoids duplicating service container setup and checkout/module-
# download costs across two independent jobs, and keeps the failure signal
# for all three tiers in one place.
#
# Called by ci.yml and release.yml so both share exactly one definition of
# "tests pass".
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (leave empty to use the caller ref)"
        type: string
        required: false
        default: ""
    outputs:
      pct:
        description: "Total statement coverage percentage"
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # 25 minutes: unit (~5m) + coverage gate (~1m) + integration (~3m) +
    # build (~2m) + e2e (~5m) + headroom for slow CI machines.
    timeout-minutes: 25
    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:4.4.0
        ports: ["4566:4566"]
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: ap-south-1
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Init LocalStack queues
        run: |
          chmod +x scripts/init-localstack.sh
          AWS_ACCESS_KEY_ID=localstack AWS_SECRET_ACCESS_KEY=localstack AWS_DEFAULT_REGION=ap-south-1 \
            ./scripts/init-localstack.sh
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
      - name: Unit tests (race + coverage)
        run: make test-ci
      - name: Coverage gate (100%)
        id: coverage
        run: bash .github/scripts/coverage-gate.sh
        env:
          COVERAGE_THRESHOLD: "100"
      - name: Integration tests
        run: make test-integration
        env:
          VALKEY_URL: localhost:6379
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: ap-south-1
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
      # E2E: drives the real compiled binary over a real gRPC connection
      # against the same Valkey/LocalStack service containers already running
      # for the integration tests above — the one tier that catches wiring
      # regressions (startup config, graceful shutdown, consumer-to-cache path)
      # that unit and integration tests structurally cannot see.
      - name: Build binary (for e2e)
        run: make build
      - name: E2E tests
        run: make test-e2e
        env:
          E2E_BINARY_PATH: ${{ github.workspace }}/bin/iam-authz-enrichment
          VALKEY_URL: localhost:6379
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: localstack
          AWS_SECRET_ACCESS_KEY: localstack
          AWS_REGION: ap-south-1
