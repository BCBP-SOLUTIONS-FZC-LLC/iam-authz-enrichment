# Triggered by version tags (e.g. v1.0.0 or v1.1.0-rc.1).
# Pipeline: validate -> build (CHANGELOG gate + binaries) -> docker (CVE scan
# + SBOM + sign) -> deploy-gate (live Helm deploy + health check) -> publish
# (GitHub Release).
#
# deploy-gate mirrors iam-user-profile's job of the same name, adapted for
# this service having no HTTP business traffic: the health query uses
# grpc_server_handled_total{status_class="5xx"} (emitted by
# platform-gincommon's gRPC interceptor chain) rather than
# http_requests_total{status_class="5xx"}, which doesn't exist here.
# status_class="5xx" only fires on a genuine transport-level RPC failure
# (panic, internal error) — internal/adapter/inbound/grpc/server.go's
# Check() always returns a nil error for every Allow/Deny outcome (the
# ext_authz convention: Deny is a successful RPC with a PERMISSION_DENIED
# payload, not a failed one), so this metric is a clean deployment-health
# signal, distinct from authz_deny_reason_total{reason="DENY_SERVICE_UNAVAILABLE"}
# (which reflects dependency health at that moment, not whether THIS
# deployment is broken — a dependency outage unrelated to the rollout could
# otherwise trigger a false-positive rollback).
#
# This job requires real infrastructure this repo does not have configured
# yet: a KUBECONFIG_B64 secret for a production cluster, K8S_NAMESPACE/
# PROMETHEUS_URL vars (optional, default 'default' namespace / skip the
# Prometheus check if unset), and a pre-provisioned Kubernetes Secret named
# iam-authz-enrichment-secrets in the target namespace (this chart's
# secret.yaml template hard-fails `helm upgrade` via existingSecret
# otherwise — see deploy/helm/values.yaml).
#
# Gated on the vars.DEPLOY_GATE_ENABLED repository/environment variable
# (default unset → skipped, not run) rather than iam-user-profile's
# unconditional job, which hard-fails if KUBECONFIG_B64 is unset (verified
# against their actual current file — there's no skip logic there either;
# it presumably just never fails for them because that secret is already
# configured for that repo). Blocking every release on infrastructure that
# doesn't exist yet is the wrong default for a brand-new service. `secrets`
# can't be read in a job-level `if:` (GitHub Actions restriction), which is
# why this uses a `vars` toggle instead of checking KUBECONFIG_B64 directly
# at that level — the in-job check below is a second, real safety net for
# the case where DEPLOY_GATE_ENABLED is set but the secret was forgotten.
# Set vars.DEPLOY_GATE_ENABLED=true once the cluster and secret both exist.
name: Release

"on":
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/iam-authz-enrichment
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    secrets: inherit

  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    secrets: inherit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag matches checkout
        run: bash .github/scripts/verify-release-tag.sh

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      # Block the release if CHANGELOG.md has no entry for this tag.
      # Cut the entry before tagging (see CONTRIBUTING.md).
      - name: Verify CHANGELOG entry exists
        run: bash .github/scripts/verify-changelog-entry.sh

      # Cross-compiles all target platforms and writes per-binary .sha256
      # files. No make build step — the script owns the full build for
      # release assets. This service is deployed exclusively as a container
      # (see README § Out of scope) — these binaries are a convenience for
      # local/non-Docker runs, not the primary distribution artifact.
      - name: Prepare release binaries (all platforms)
        run: bash .github/scripts/prepare-release-binary.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ env.RELEASE_TAG }}
          path: |
            iam-authz-enrichment_*
            release-asset.name
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    needs: build
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Produces: vMAJOR.MINOR.PATCH, vMAJOR.MINOR, vMAJOR (non-pre-releases).
          # Also tags 'latest' for stable releases (no pre-release suffix).
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          # amd64-only by design, same as ci.yml's push job — no platforms
          # fan-out until there's a real arm64 deploy target.
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          # No cache-from/cache-to here — combining the GHA cache backend
          # with provenance/SBOM attestations on the same build silently
          # drops the attestation entirely (moby/buildkit#4501, "gha cache
          # breaks provenance"). Caught this because export-image-provenance.sh
          # kept reporting zero attestations even after fixing the
          # predicate-type filter (v0.2, not v1) below — that fix was
          # correct but not sufficient, since no attestation of any type
          # was actually being attached. Release builds are infrequent, so
          # losing this cache is an acceptable trade for a supply-chain
          # artifact that's actually present.

      - name: Cache Trivy DB
        uses: actions/cache@v6.0.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Scan the released image for OS and library CVEs. Critical/High
      # findings fail the release — a known-vulnerable image must not be
      # tagged as a release that consuming services will pin.
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          cache-dir: /tmp/trivy-cache

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full component inventory for compliance / audit.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: "0"
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Export SLSA provenance
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
        run: bash .github/scripts/export-image-provenance.sh

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provenance-${{ env.RELEASE_TAG }}
          path: provenance.slsa.json
          retention-days: 90

      # Keyless signing via Sigstore OIDC — no long-lived key to rotate or leak.
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/tags/.*$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

  # Post-deploy health gate — skipped unless vars.DEPLOY_GATE_ENABLED is
  # "true" (see this file's header comment for why that's the default,
  # rather than always running and failing on a missing KUBECONFIG_B64).
  # When enabled: deploys the image with Helm, waits for rollout, verifies
  # the deployed digest matches what was pushed, then checks the error rate
  # for 2 minutes. On failure, automatically rolls back and fails the release.
  # Requires: KUBECONFIG_B64 secret, K8S_NAMESPACE var (optional), PROMETHEUS_URL var (optional).
  deploy-gate:
    name: Post-deploy health gate
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: vars.DEPLOY_GATE_ENABLED == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify KUBECONFIG_B64 is configured
        run: |
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "::error::KUBECONFIG_B64 secret is not set. Configure the kubeconfig for the production cluster before tagging releases. See CONTRIBUTING.md § Deployment."
            exit 1
          fi

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Deploy the just-published image via Helm so the gate is never a no-op,
      # regardless of whether a GitOps controller is configured. existingSecret
      # assumes a Kubernetes Secret named iam-authz-enrichment-secrets already
      # exists in the target namespace — this chart's secret.yaml template
      # hard-fails the render otherwise (see deploy/helm/values.yaml).
      - name: Deploy with Helm
        run: |
          helm upgrade iam-authz-enrichment ./deploy/helm \
            --install \
            --wait \
            --timeout=5m \
            --namespace="${{ vars.K8S_NAMESPACE || 'default' }}" \
            --set image.tag="${{ needs.docker.outputs.version }}" \
            --set existingSecret=iam-authz-enrichment-secrets \
            --atomic

      # Verify the running image digest matches what was signed and published.
      # Guards against a GitOps controller or deployment process substituting a
      # different image after the Helm upgrade.
      - name: Verify deployed image digest
        run: |
          EXPECTED_DIGEST="${{ needs.docker.outputs.digest }}"
          ACTUAL=$(kubectl get deployment iam-authz-enrichment \
            --namespace="${{ vars.K8S_NAMESPACE || 'default' }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Expected digest: ${EXPECTED_DIGEST}"
          echo "Deployed image:  ${ACTUAL}"
          if [[ "$ACTUAL" == *"@sha256:"* ]]; then
            ACTUAL_DIGEST="${ACTUAL#*@}"
            if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "::error::Deployed image digest ${ACTUAL_DIGEST} does not match published digest ${EXPECTED_DIGEST} — potential supply-chain substitution."
              exit 1
            fi
            echo "Digest verified: deployed image matches published artifact."
          else
            echo "::warning::Deployed image is not digest-pinned — cannot verify supply-chain integrity. Pin image digests in the Helm values."
          fi

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/iam-authz-enrichment \
            --namespace="${{ vars.K8S_NAMESPACE || 'default' }}" \
            --timeout=5m

      # status_class="5xx" only fires on a genuine gRPC transport-level
      # failure (panic, internal error) — Check() always returns a nil
      # error for every Allow/Deny outcome, so this is a clean
      # deployment-health signal (see this file's header comment for why
      # it's deliberately not authz_deny_reason_total).
      - name: Health gate — error rate < 1% for 2 minutes
        run: |
          PROM_URL="${{ vars.PROMETHEUS_URL }}"
          if [ -z "$PROM_URL" ]; then
            echo "PROMETHEUS_URL not set — skipping error-rate check"
            exit 0
          fi
          QUERY='sum(rate(grpc_server_handled_total{job=~".*iam-authz-enrichment.*",status_class="5xx"}[2m]))/sum(rate(grpc_server_handled_total{job=~".*iam-authz-enrichment.*"}[2m]))'
          # Sleep AFTER confirming Prometheus is configured so the 2-minute window
          # only runs when there is actually something to measure.
          sleep 120
          RATE=$(curl -sf "${PROM_URL}/api/v1/query" \
            --data-urlencode "query=${QUERY}" | jq -r '.data.result[0].value[1] // "0"')
          echo "5xx rate: ${RATE}"
          if awk "BEGIN{exit !($RATE > 0.01)}"; then
            echo "ERROR: 5xx rate ${RATE} exceeds 1% threshold — rolling back"
            # Use helm rollback so Helm's release history stays consistent.
            # kubectl rollout undo bypasses the Helm state machine and leaves
            # subsequent helm upgrade calls working from the wrong baseline.
            helm rollback iam-authz-enrichment \
              --namespace="${{ vars.K8S_NAMESPACE || 'default' }}" \
              --wait
            exit 1
          fi
          echo "Health gate passed — 5xx rate ${RATE} is below 1%"

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    # deploy-gate must succeed OR be legitimately skipped (vars.DEPLOY_GATE_ENABLED
    # unset — no cluster configured yet). A *failed* gate (it ran and the
    # health check or digest verification tripped) still blocks publish —
    # only skip vs. fail are treated differently here.
    needs: [build, docker, deploy-gate]
    if: needs.build.result == 'success' && needs.docker.result == 'success' && (needs.deploy-gate.result == 'success' || needs.deploy-gate.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        env:
          IMAGE_VERSION: ${{ needs.docker.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/extract-release-notes.sh

      # Makes the skip visible on the Release page itself, not just in this
      # ephemeral workflow run's logs — someone reading the release later
      # has no other way to know this wasn't verified against a live deploy.
      - name: Note skipped deploy-gate in release notes
        if: needs.deploy-gate.result == 'skipped'
        run: |
          {
            echo ""
            echo "---"
            echo "⚠️ **Not deployed/health-checked** — \`deploy-gate\` was skipped (\`vars.DEPLOY_GATE_ENABLED\` unset). This release was not verified against a live deployment."
          } >> release-notes.md

      - name: Download SBOM
        uses: actions/download-artifact@v8.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}

      - name: Download provenance
        uses: actions/download-artifact@v8.0.1
        with:
          name: provenance-${{ env.RELEASE_TAG }}

      - name: Download binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: binary-${{ env.RELEASE_TAG }}
          path: .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/create-github-release.sh
