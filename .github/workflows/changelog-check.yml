# Pre-merge CHANGELOG check.
# Fails if a PR modifies internal/ or cmd/ without also updating CHANGELOG.md.
name: Changelog check

"on":
  pull_request:
    branches: [main, master]
    paths:
      - 'internal/**'
      - 'cmd/**'

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: CHANGELOG updated in this PR
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes internal/ or cmd/ but does not update CHANGELOG.md. Add an entry under the Unreleased section before merging."
            exit 1
          fi
