# Pre-merge CHANGELOG check.
# Fails if a PR modifies internal/, cmd/, deploy/, or api/ without also
# updating CHANGELOG.md. api/ includes api/asyncapi.yaml — the event-contract
# spec — whose changes are part of the runtime contract (§ VERSIONING.md) and
# must be recorded in the changelog for downstream consumers to notice.
name: Changelog check

"on":
  pull_request:
    branches: [main, master]
    paths:
      - 'internal/**'
      - 'api/**'
      - 'cmd/**'
      - 'deploy/**'
      - 'api/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: CHANGELOG updated in this PR
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes internal/, api/, cmd/, or deploy/ but does not update CHANGELOG.md. Add an entry under the Unreleased section before merging."
            exit 1
          fi
