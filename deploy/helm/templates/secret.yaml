{{- /*
Secret management — two modes:

1. existingSecret (recommended for production): set .Values.existingSecret to the
   name of a pre-provisioned Secret. The chart creates no Secret resource and
   secretValues is ignored. Use with External Secrets Operator, AWS Secrets Manager
   CSI driver, or Sealed Secrets so credentials never appear in Helm release history.

2. secretValues (dev / CI only): omit existingSecret and supply values via
   --set 'secretValues.VALKEY_URL=...' or a Helm secrets plugin.
   WARNING: Helm stores these in the release history Secret (base64, not encrypted).
   Anyone with `helm get values` or read access to the release namespace can recover them.
*/ -}}
{{- if not .Values.existingSecret }}
{{- range .Values.envFromSecret }}
{{- $val := index $.Values.secretValues . }}
{{- if not $val }}
{{- fail (printf "Secret key %q is required but not set. Either set existingSecret to an existing Secret name, or provide the value via: --set 'secretValues.%s=<value>'." . .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}-secrets
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range .Values.envFromSecret }}
  {{ . }}: {{ index $.Values.secretValues . | quote }}
  {{- end }}
{{- end }}
