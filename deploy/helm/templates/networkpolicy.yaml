{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iam-authz-enrichment.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow Authorization.Check traffic from wherever Envoy's ext_authz filter
    # runs. For Envoy Gateway the data-plane pods run in the same namespace as
    # the Gateway resource; set envoyNamespaceSelector to that namespace label
    # and envoyPodSelector to the Envoy pod labels. Unlike a typical backend
    # service, there is deliberately no "allow same-namespace pods" rule here —
    # nothing else in the mesh calls this service peer-to-peer.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.envoyNamespaceSelector | nindent 14 }}
          {{- with .Values.networkPolicy.envoyPodSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .Values.service.grpcPort }}
          protocol: TCP

    # Allow Prometheus to scrape /metrics — restricted to the monitoring namespace.
    {{- if .Values.networkPolicy.metricsIngress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsIngress.podSelector | nindent 14 }}
      ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
    {{- end }}

    {{- with .Values.networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  egress:
    # Allow DNS resolution (required for all outbound connections).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow HTTPS to AWS endpoints (SQS, STS for IRSA).
    - ports:
        - port: 443
          protocol: TCP

    # Allow Valkey (Redis-protocol) connections.
    - ports:
        - port: 6379
          protocol: TCP

    # Allow OTel OTLP gRPC to the collector.
    - ports:
        - port: 4317
          protocol: TCP

    # Org & Membership (ORG_MEMBERSHIP_BASE_URL) has no fixed port convention
    # the way Valkey/AWS do — add a rule for it via additionalEgressRules,
    # e.g. the in-cluster port that service actually listens on.
    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
