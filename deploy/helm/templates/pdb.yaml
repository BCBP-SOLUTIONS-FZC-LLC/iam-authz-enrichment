{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  # At least 2 pods must remain available during voluntary disruptions
  # (node drains, rolling updates). With minReplicas: 3 this allows
  # one pod to be evicted at a time without violating the anti-affinity
  # requirement or taking the service below quorum.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "iam-authz-enrichment.selectorLabels" . | nindent 6 }}
{{- end }}
