{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  # At least 2 pods must remain available during voluntary disruptions
  # (node drains, rolling updates). With minReplicas: 5 this allows
  # multiple pods to be evicted at a time without taking the service below
  # quorum; topology spread then reschedules them across zones/nodes.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "iam-authz-enrichment.selectorLabels" . | nindent 6 }}
{{- end }}
