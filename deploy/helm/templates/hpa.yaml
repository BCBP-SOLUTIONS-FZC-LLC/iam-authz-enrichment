{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "iam-authz-enrichment.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- if .Values.autoscaling.targetDecisionsPerSecondPerReplica }}
    # Decision-rate scaling: every Check() call increments authz_decisions_total
    # exactly once, so this is a direct per-pod load signal — not an
    # approximation the way a generic HTTP request counter would be for a
    # multi-endpoint service.
    # PREREQUISITE: the prometheus-adapter must be installed and configured with
    # the rule at deploy/monitoring/prometheus-adapter-rule.yaml. Without it this
    # metric is silently absent from the custom metrics API and HPA falls back to
    # CPU/memory only.
    - type: Pods
      pods:
        metric:
          name: authz_decisions_per_second
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetDecisionsPerSecondPerReplica }}
    {{- end }}
{{- end }}
