{{- if and (eq (toString .Values.env.APP_ENV) "prod") (not .Values.grpcTLS.enabled) (not .Values.grpcTLS.meshProvidesMTLS) }}
{{- fail "APP_ENV=prod with plaintext gRPC: set grpcTLS.enabled=true, or grpcTLS.meshProvidesMTLS=true once you have confirmed a service mesh / CNI encrypts traffic to this pod (values.yaml grpcTLS)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "iam-authz-enrichment.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge first, never drop below the desired count: with topology spread
      # (not hard anti-affinity) a surge pod can always schedule, so a rollout
      # never reduces capacity on the authorization path.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "iam-authz-enrichment.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.existingSecret }}
        # When using an external secret (ESO / CSI), bump rotationEpoch to force
        # a rollout after secret rotation:
        #   helm upgrade ... --set rotationEpoch=$(date +%s)
        rotationEpoch: {{ .Values.rotationEpoch | default "0" | quote }}
        {{- else }}
        # Force rollout when the Secret changes (checksum triggers pod recycling).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "iam-authz-enrichment.fullname" . }}{{ else }}default{{ end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # distroless nonroot UID
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "iam-authz-enrichment.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BUILD_VERSION
              value: {{ include "iam-authz-enrichment.imageTag" . | quote }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- $secretName := default (printf "%s-secrets" (include "iam-authz-enrichment.fullname" .)) .Values.existingSecret }}
            {{- range .Values.envFromSecret }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
            {{- if .Values.grpcTLS.enabled }}
            - name: GRPC_TLS_CERT_FILE
              value: /etc/grpc-tls/tls.crt
            - name: GRPC_TLS_KEY_FILE
              value: /etc/grpc-tls/tls.key
            {{- if .Values.grpcTLS.requireClientCert }}
            - name: GRPC_TLS_CLIENT_CA_FILE
              value: /etc/grpc-tls/ca.crt
            {{- end }}
            {{- end }}
          {{- if .Values.grpcTLS.enabled }}
          volumeMounts:
            - name: grpc-tls
              mountPath: /etc/grpc-tls
              readOnly: true
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.grpcTLS.enabled }}
      volumes:
        - name: grpc-tls
          secret:
            secretName: {{ .Values.grpcTLS.secretName }}
      {{- end }}
      topologySpreadConstraints:
        # values.yaml topologySpread: hard across zones, best effort across
        # nodes — see the comment there for why this replaced hard
        # one-pod-per-node anti-affinity.
        - maxSkew: {{ .Values.topologySpread.zoneMaxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.zoneWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "iam-authz-enrichment.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.nodeMaxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.nodeWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "iam-authz-enrichment.selectorLabels" . | nindent 14 }}
