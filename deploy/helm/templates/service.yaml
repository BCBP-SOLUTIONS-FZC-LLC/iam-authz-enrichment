apiVersion: v1
kind: Service
metadata:
  name: {{ include "iam-authz-enrichment.fullname" . }}
  labels:
    {{- include "iam-authz-enrichment.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "iam-authz-enrichment.selectorLabels" . | nindent 4 }}
