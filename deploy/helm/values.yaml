# No ingress / HTTPRoute / SecurityPolicy templates in this chart, unlike
# iam-user-profile's. This service has no public HTTP API — Envoy calls
# Authorization.Check directly as a grpc_service cluster reference in its
# ext_authz filter config (README § Envoy configuration sketch), not through
# a Gateway API Route. There is nothing to route to; the grpc Service below
# is reached by cluster DNS name, same as any other internal gRPC backend.

replicaCount: 5

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/iam-authz-enrichment
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  # Annotations added to the ServiceAccount — use for IRSA on EKS:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/iam-authz-enrichment
  # When IRSA is configured, remove AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  # from envFromSecret / secretValues and rely on the pod's ambient IAM role instead.
  annotations: {}

# Three ports: grpc is the actual traffic (Envoy's Authorization.Check
# calls); http carries only /healthz and /readyz — no business routes;
# metrics is /metrics on its own dedicated port/listener, separate from
# http — mirrors iam-org-membership's/iam-tender-acl's/iam-user-profile's/
# iam-catalog-admin's identical split (fleet-wide consistency; http here
# already carries no business API, so this isn't closing a NetworkPolicy
# gap the way it does for those services).
service:
  type: ClusterIP
  grpcPort: 9091
  httpPort: 8080
  metricsPort: 9090

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  # RPS-equivalent: every Check() call produces exactly one iam_authz_enrichment_decisions_total
  # increment, so this is a direct per-pod decision-rate target, not an
  # approximation the way a generic HTTP request counter would be.
  targetDecisionsPerSecondPerReplica: 500

# No CPU limit, deliberately: Check has a 15ms p99 budget (LLD §11.1), and a
# CFS quota throttles a burst for the rest of its 100ms period — exactly the
# tail latency the budget forbids. The request reserves real capacity for
# scheduling and HPA instead. Memory stays limited; GOMEMLIMIT (env below)
# keeps the Go heap under it so the GC works harder before the kernel OOM-kills.
resources:
  requests:
    cpu: "250m"
    memory: "128Mi"
  limits:
    memory: "256Mi"

env:
  # The service label on every metric and the OTel service.name. cmd/server
  # passes it to gincommon (Config/TracingConfig) explicitly, so
  # OTEL_SERVICE_NAME is not needed. Must stay "iam-authz-enrichment": the
  # alert rules and dashboards select service="iam-authz-enrichment".
  APP_NAME: "iam-authz-enrichment"
  # Enterprise Platform Observability Standard environment vocabulary:
  # local | dev | test | staging | prod (no aliases — "production" fails
  # startup). It is the environment label on every metric.
  APP_ENV: "prod"
  # Registry domain for the {domain, service, environment} metric labels.
  # cmd/server also sets it explicitly; this is the documented fallback.
  OBSERVABILITY_DOMAIN: "iam"
  APP_PORT: "8080"
  METRICS_PORT: "9090"
  # Valkey timeouts for SQS event processing (a separate client from the
  # request path's 10ms one): an eviction has no latency budget, and a failed
  # one waits a full visibility timeout (30s) before its retry.
  VALKEY_EVENT_TIMEOUT: "500ms"
  GRPC_PORT: "9091"

  # §4.1 cache TTLs / jitter and the §7 stale-if-error hard cap. Defaults match
  # .env-example; override only if the platform team has a documented reason.
  AE_CTX_TTL: "60s"
  AE_CTX_JITTER: "6s"
  AE_TENDER_ACL_TTL: "15s"
  AE_NEG_TTL: "5s"
  AE_RESTRICTED_NEG_TTL: "5s"
  AE_REALM_NEG_TTL: "5s"
  AE_PROCESSED_EVENT_TTL: "168h"
  AE_STALE_IF_ERROR_MAX_AGE: "5m"

  # Org & Membership sibling service (§6) — I-8/I-14. IAM convention: every
  # service runs in namespace "iam" as a Service named after its repo on port
  # 8080. Override per environment if a cluster differs. (An empty value falls
  # back to the local-dev default, which config.Load rejects outside dev.)
  ORG_MEMBERSHIP_BASE_URL: "http://iam-org-membership.iam.svc.cluster.local:8080"
  # 40ms covers Org & Membership's own I-8 p99 targets (15ms cache hit, 30ms
  # miss) plus the mesh hop — LLD §16 AE-37. Shorter fails healthy calls.
  ORG_MEMBERSHIP_TIMEOUT: "40ms"

  # iam-tender-acl sibling service — TAC-4 (formerly I-12), repointed here
  # from Org & Membership per ADR-0007 Wave 3 Phase 4. Same IAM convention
  # (iam-tender-acl README "Onboarding a TAC-4 caller", its LLD §21.5).
  TENDER_ACL_BASE_URL: "http://iam-tender-acl.iam.svc.cluster.local:8080"
  # TAC-4 targets 5ms hit / 20ms miss (iam-tender-acl LLD §14.1) + headroom.
  TENDER_ACL_TIMEOUT: "30ms"

  # Tenant resolution (§2 point 3). SHARED_REALM_ISSUER is required — the
  # Keycloak issuer for the shared trial realm. REALM_TENANT_MAP_SEED is a
  # startup-only JSON seed for dedicated realms, kept fresh at runtime by the
  # tenant-authz-q consumer — leave "{}" unless bootstrapping a fresh cluster.
  SHARED_REALM_ISSUER: ""
  REALM_TENANT_MAP_SEED: "{}"

  # Must match the Envoy jwt_authn filter config exactly (README § Envoy
  # configuration sketch) — see internal/adapter/inbound/grpc/claims.go.
  JWT_METADATA_NAMESPACE: "envoy.filters.http.jwt_authn"
  JWT_PAYLOAD_KEY: "trial"

  # gRPC server tuning (§11). Message-size limits are deliberately far below
  # gRPC-Go's 4MiB default — CheckRequest/CheckResponse payloads are small;
  # this is defense-in-depth, not a real operating limit.
  GRPC_MAX_CONCURRENT_STREAMS: "1000"
  GRPC_KEEPALIVE_TIME: "30s"
  GRPC_KEEPALIVE_TIMEOUT: "5s"
  # Server-side cap on each Check (grpccommon.TimeoutUnaryInterceptor). Envoy's
  # ext_authz grpc_service timeout (README, 250ms) normally arrives as a
  # grpc-timeout and wins; this bounds a caller that sends none. Covers the
  # worst sequential path: Valkey reads + I-8 + TAC-4 + I-14 (~170ms).
  GRPC_REQUEST_TIMEOUT: "250ms"
  GRPC_MAX_RECV_MSG_SIZE_BYTES: "262144"
  GRPC_MAX_SEND_MSG_SIZE_BYTES: "262144"

  # AWS — five inbound SQS queues, zero outbound (§5). Required outside
  # APP_ENV=dev: a blank URL fails startup (idle consumers look healthy
  # while cache never evicts). Override every URL for production.
  AWS_REGION: "ap-south-1"
  AWS_ENDPOINT_URL: ""   # blank → real AWS SQS; only set for LocalStack-backed environments
  MEMBERSHIP_AUTHZ_QUEUE_URL: ""
  USER_AUTHZ_QUEUE_URL: ""
  BILLING_AUTHZ_QUEUE_URL: ""
  TENANT_AUTHZ_QUEUE_URL: ""
  TENDER_AUTHZ_QUEUE_URL: ""
  # SQS consumer knobs read by platform-events (LoadSQS / SQSConsumerOptions).
  # SQS_MAX_RECEIVE_COUNT is deliberately absent: the consumer pins its
  # threshold to 4 (one short of each queue's RedrivePolicy maxReceiveCount=5)
  # and forwards the 5th delivery to the DLQ itself (LLD §16 AE-36).
  SQS_MAX_MESSAGES: "10"
  SQS_WAIT_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT: "30s"
  # Bounds each handler call (Valkey evictions — milliseconds normally); stays
  # below the 30s visibility timeout so a hung handler fails before the message
  # reappears to another replica.
  SQS_HANDLER_TIMEOUT: "20s"
  # How long Stop() waits for in-flight handlers at shutdown. 30s is the
  # library default the terminationGracePeriodSeconds budget below assumes
  # (10s gRPC + 10s HTTP + 30s drain + 5s = 55s of 60s); raise both together.
  SQS_DRAIN_TIMEOUT: "30s"
  # Samples platform_queue_depth / platform_dlq_depth for every queue (needs
  # sqs:GetQueueAttributes on the -dlq queues, deploy/iam/policy.json).
  SQS_QUEUE_DEPTH_INTERVAL: "60s"
  # events.WithConcurrency per queue (platform-events' own default is 1, fully
  # serial). Overrides SQS_CONCURRENCY, which is therefore not set.
  MEMBERSHIP_AUTHZ_QUEUE_CONCURRENCY: "4"
  USER_AUTHZ_QUEUE_CONCURRENCY: "4"
  BILLING_AUTHZ_QUEUE_CONCURRENCY: "4"
  TENANT_AUTHZ_QUEUE_CONCURRENCY: "4"
  TENDER_AUTHZ_QUEUE_CONCURRENCY: "4"

  # Tracing — read by platform-gincommon. Same values as iam-org-membership.
  # "none" (gincommon v1.6.0+) installs the in-process provider without export.
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "false"
  # Head-sampling ratio for new traces (parent-based).
  OTEL_TRACES_SAMPLER_RATIO: "0.1"
  # W3C baggage propagation on outbound I-8/I-14/TAC-4 calls.
  OTEL_PROPAGATOR_BAGGAGE: "false"
  # true re-samples spans whose remote parent (Envoy) is marked sampled, so a
  # caller cannot force 100% sampling. Envoy is trusted here, so false.
  OTEL_TRACES_IGNORE_REMOTE_PARENT_SAMPLED: "false"

  # Logging — read by platform-gincommon's logger.
  LOG_LEVEL: "info"          # debug | info | warn | error
  # true: every Check logs one grpc_request line at INFO — ~2,500 lines/s at
  # 5 replicas × 500 decisions/s. Sampling keeps the first 100/s per message
  # and level, then 1 in 100; denies and errors stay visible in metrics.
  LOG_SAMPLING: "true"
  # Soft heap limit for the Go runtime, ~90% of resources.limits.memory —
  # change both together.
  GOMEMLIMIT: "230MiB"

  # AsyncAPI viewer (/asyncapi) — off in prod unless enabled; optionally
  # bearer-gated by DOCS_AUTH_TOKEN (add it to envFromSecret to use it).
  DOCS_ENABLED: "false"

envFromSecret:
  - VALKEY_URL
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY

# existingSecret — preferred for production.
# Set to the name of a pre-existing Kubernetes Secret whose keys match envFromSecret.
# When set, the chart will NOT create a Secret resource; secretValues is ignored.
# Use with External Secrets Operator, AWS Secrets Manager CSI, or Sealed Secrets:
#   existingSecret: "iam-authz-enrichment-secrets"
existingSecret: ""

# rotationEpoch — used only when existingSecret is set.
# Bump this value to trigger a rolling restart after an external secret is rotated:
#   helm upgrade ... --set rotationEpoch=$(date +%s)
rotationEpoch: "0"

# Secret values — used ONLY when existingSecret is empty.
# Pass via --set or a Helm secrets plugin (never commit real values).
# Warning: Helm stores these in the release history Secret (base64, not encrypted).
# In production, always prefer existingSecret over this map.
secretValues:
  VALKEY_URL: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

# gRPC GracefulStop (10s cap, falling back to a hard Stop() — cmd/server/
# main.go's grpcGracefulStopTimeout) + HTTP+metrics Shutdown (10s cap,
# httpShutdownTimeout) + 5 SQS consumers Stop()'d concurrently (one drain
# window, not 5x — platform-events default 30s+5s margin). Worst case
# 10+10+35 = 55s, a 5s margin under the 60s below rather than eating the
# whole budget on the two phases (an in-flight Check() call, a health/
# metrics HTTP request) least likely to ever need more than a few ms.
terminationGracePeriodSeconds: 60

# podDisruptionBudget — ensures at least 2 pods survive voluntary disruptions
# (node drains, cluster upgrades). Requires replicaCount >= 3 (comfortably
# true at the default of 5); set enabled: false only when running fewer than
# 3 replicas (dev/staging scale-down).
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Spread replicas across zones (hard) and nodes (best effort). Replaces the
# old hard one-pod-per-node anti-affinity, which needed ≥ minReplicas (5)
# nodes just to start, left HPA scale-out beyond the node count Pending, and
# never spread across zones. A zone outage now takes at most ~1/zones of the
# fleet; set zoneWhenUnsatisfiable: ScheduleAnyway on single-zone clusters.
topologySpread:
  zoneMaxSkew: 1
  zoneWhenUnsatisfiable: DoNotSchedule
  nodeMaxSkew: 1
  nodeWhenUnsatisfiable: ScheduleAnyway

# startupProbe budget is short — unlike iam-user-profile there are no
# migrations or schema checks to wait out; Valkey/SQS/Org&Membership are all
# soft dependencies per §7, so the process is ready almost immediately after
# the gRPC/HTTP listeners bind.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 6   # 6 × 5s = 30s startup budget
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0   # startupProbe handles the initial delay
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

# /readyz deliberately reports process-startup only, NOT dependency health
# (internal/adapter/inbound/http/router.go) — this service never goes
# "unready" due to a downstream outage, by design (§7: bypass, not fail).
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 3

# grpcTLS — disabled by default: the gRPC server listens in plaintext,
# trusting a service mesh sidecar or the CNI layer to terminate mTLS
# transparently (see networkPolicy's comment above and README § Security).
# Enable this ONLY when the target cluster has no such layer — it makes
# cmd/server/main.go terminate TLS itself instead.
#
# When enabled, secretName must reference a pre-existing Kubernetes Secret
# (kubernetes.io/tls type, or Opaque with matching keys) containing at
# least tls.crt/tls.key; set requireClientCert to also mount ca.crt and
# require/verify a client certificate (mTLS) rather than server-side-only
# TLS. This chart does not create that Secret — provision it the same way
# as iam-authz-enrichment-secrets (existingSecret, cert-manager, ESO, etc.).
grpcTLS:
  enabled: false
  secretName: "iam-authz-enrichment-tls"
  requireClientCert: false
  # With grpcTLS.enabled false the gRPC port is plaintext, so encryption in
  # transit depends on a service mesh / CNI providing mTLS — which this chart
  # cannot verify. With APP_ENV=prod the chart refuses to render until you
  # either enable grpcTLS or set this to true, confirming the mesh exists.
  meshProvidesMTLS: false

# NetworkPolicy — enabled by default. Restricts grpc-port ingress to wherever
# Envoy's ext_authz caller actually runs, and http-port (metrics) ingress to
# the monitoring namespace. Override to false only in environments where the
# CNI plugin does not support NetworkPolicy.
#
# Envoy Gateway: data-plane Envoy proxy pods run in the same namespace as the
# Gateway resource (not envoy-gateway-system, which is the control plane).
# Service mesh sidecar (Istio/Linkerd ext_authz): every namespace running a
# sidecar needs to reach this Service — widen ingressControllerNamespaceSelector
# accordingly, or use additionalIngressRules for a mesh-wide allow.
#
# NetworkPolicy alone is L3/L4 segmentation — it does NOT encrypt traffic.
# "Envoy calls this service over mTLS" (README § Security) describes the
# INTENDED deployment: a service mesh sidecar or the CNI layer terminating
# mTLS transparently, which this chart cannot configure or verify from here
# — confirm the target cluster actually has one before shipping real
# traffic. grpcTLS below is the fallback for clusters that don't.
networkPolicy:
  enabled: true
  # Namespace label selector for wherever Envoy's ext_authz filter runs.
  # Envoy Gateway:   kubernetes.io/metadata.name: <namespace where Gateway lives>
  envoyNamespaceSelector:
    kubernetes.io/metadata.name: envoy-gateway-system
  # Optional pod label selector — combined with namespaceSelector (logical AND).
  # Envoy Gateway data-plane pods carry:
  #   gateway.envoyproxy.io/owning-gateway-name: <gateway-name>
  #   gateway.envoyproxy.io/owning-gateway-namespace: <gateway-namespace>
  # Leave empty ({}) to allow all pods in the Envoy namespace.
  envoyPodSelector: {}
  metricsIngress:
    enabled: true
    # Namespace where Prometheus runs.
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    # Pod label selector for the Prometheus pod.
    podSelector:
      app.kubernetes.io/name: prometheus
  # Extra ingress rules (raw NetworkPolicy ingress spec entries).
  additionalIngressRules: []
  # Egress to the two synchronous HTTP siblings, each restricted to that
  # service's own pods on its HTTP port. The labels are the pods' real
  # selectorLabels (app.kubernetes.io/name = each chart's name): Org &
  # Membership's chart is "iam-org-membership", iam-tender-acl's chart is
  # "tender-acl" (its Service is named iam-tender-acl, its pods are not).
  # iam-tender-acl must in turn list this service's pods
  # (app.kubernetes.io/name: iam-authz-enrichment) in its own
  # networkPolicy.internalCallerPodSelectors.
  upstreamEgress:
    - name: iam-org-membership   # ORG_MEMBERSHIP_BASE_URL — I-8 / I-14
      namespaceSelector:
        kubernetes.io/metadata.name: iam
      podSelector:
        app.kubernetes.io/name: iam-org-membership
      port: 8080
    - name: iam-tender-acl       # TENDER_ACL_BASE_URL — TAC-4
      namespaceSelector:
        kubernetes.io/metadata.name: iam
      podSelector:
        app.kubernetes.io/name: tender-acl
      port: 8080
  # Extra egress rules (raw NetworkPolicy egress spec entries).
  additionalEgressRules: []

# ServiceMonitor — requires kube-prometheus-stack (monitoring.coreos.com/v1 CRD).
# Enable to have Prometheus auto-discover and scrape /metrics.
# NOTE: PrometheusRule (alerting rules) is also gated on this flag — no scrape
# means no metrics, which means all alerts stay permanently inactive. Set to
# true (and add the correct serviceMonitorSelector labels) before relying on
# any alert in deploy/monitoring/ or deploy/helm/templates/prometheusrule.yaml.
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  # Labels added to the ServiceMonitor (must match your Prometheus operator's
  # serviceMonitorSelector — typically: release: kube-prometheus-stack).
  additionalLabels: {}
  # Relabeling rules applied to scraped metrics before ingestion.
  relabelings: []
  # Restrict to this namespace; omit to match the release namespace.
  namespaceSelector: {}
