# Prometheus alerting rules for the iam-authz-enrichment application.
#
# All authz_* metrics are registered in internal/adapter/outbound/metrics/recorder.go
# (§10). Thresholds below match the SLOs documented in ARCHITECTURE.md § Observability
# stack — decision latency p99 > 50ms/5min → SEV-2, availability < 99.5%/10min → SEV-1,
# authz_stale_if_error_served_total nonzero → page directly (a live dependency outage).
#
# This service has no HTTP business API (no http_requests_total, no 5xx rate) and no
# database — its closest equivalent to a request-error rate is the DENY_SERVICE_UNAVAILABLE
# deny reason (§7 fail-closed / dependency failure), not a generic deny rate: most denies
# are the policy working correctly, not an error.
#
# Deploy via PrometheusRule CRD (kube-prometheus-stack) or include in a
# Prometheus --rule-files directory.
#
# Label on all authz_* metrics: job — "iam-authz-enrichment"

groups:
  - name: iam_authz_enrichment_availability
    rules:

      # ── Service down ──────────────────────────────────────────────────────────
      - alert: AuthzEnrichmentDown
        expr: |
          absent(up{job="iam-authz-enrichment"} == 1)
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-authz-enrichment has no healthy instances
          description: >-
            No iam-authz-enrichment pods have been scraped as healthy for 2 minutes.
            Every request behind Envoy's ext_authz filter depends on this service —
            this is a platform-wide outage, not a degradation.
            Check pod readiness: kubectl get pods -l app.kubernetes.io/name=iam-authz-enrichment

      # ── Pod count below minimum ───────────────────────────────────────────────
      - alert: AuthzEnrichmentReplicasMissing
        expr: |
          sum(up{job="iam-authz-enrichment"}) < 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-authz-enrichment running below minimum replica count
          description: >-
            Fewer than 2 replicas are healthy. The PDB requires minAvailable=2;
            a further disruption will block node drains.
            Current healthy count: {{ $value }}.

      # ── Availability SLO (ARCHITECTURE.md §10: <99.5% over 10m → SEV-1) ───────
      - alert: AuthzEnrichmentAvailabilitySLOBreach
        expr: |
          avg(avg_over_time(up{job="iam-authz-enrichment"}[10m])) < 0.995
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-authz-enrichment availability below 99.5% SLO — SEV-1
          description: >-
            Fleet-wide scrape-success ratio over the last 10 minutes is
            {{ $value | humanizePercentage }}, below the documented 99.5% SLO.
            This is a SEV-1 per ARCHITECTURE.md §10 — escalate immediately.

  - name: iam_authz_enrichment_latency
    rules:

      # ── Decision latency SLO (ARCHITECTURE.md §10: p99 > 50ms/5m → SEV-2) ─────
      - alert: AuthzEnrichmentDecisionLatencySLOBreach
        expr: |
          histogram_quantile(0.99,
            sum by (le) (
              rate(authz_decision_latency_seconds_bucket{job="iam-authz-enrichment"}[5m])
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-authz-enrichment p99 decision latency above 50ms SLO — SEV-2
          description: >-
            The p99 Check() decision latency is {{ $value | humanizeDuration }},
            exceeding the documented 50ms SLO. This is a SEV-2 per ARCHITECTURE.md
            §10. Check authz_i8_call_latency_seconds / authz_i12_call_latency_seconds
            for whether Org & Membership is the bottleneck, and Valkey round-trip
            time if cache hit ratio has dropped.

  - name: iam_authz_enrichment_dependency_health
    rules:

      # ── Stale-if-error serving (explicit "page on it directly" per §10) ───────
      - alert: AuthzEnrichmentStaleIfErrorServing
        expr: |
          rate(authz_stale_if_error_served_total{job="iam-authz-enrichment"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-authz-enrichment is serving stale cache entries — live dependency outage
          description: >-
            authz_stale_if_error_served_total is increasing, meaning §7's
            stale-if-error path is active: a live outage of a dependency
            (Valkey or Org & Membership) is in progress right now. Page
            immediately rather than waiting for the latency/availability SLO
            alerts above to trip — this metric is the earliest signal.

      # ── Fail-closed / dependency-failure deny spike ────────────────────────────
      - alert: AuthzEnrichmentServiceUnavailableSpike
        expr: |
          rate(authz_deny_reason_total{job="iam-authz-enrichment", reason="DENY_SERVICE_UNAVAILABLE"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-authz-enrichment is denying requests due to a dependency failure
          description: >-
            A sustained rate of DENY_SERVICE_UNAVAILABLE means §7's failure-handling
            matrix is fail-closing on a dependency outage outside the stale-if-error
            grace window (or the tender-ACL overlay's independent fail-closed rule
            is firing on I-12 failures). Check Org & Membership and Valkey health.
            Rate: {{ $value | humanize }}/s.

  - name: iam_authz_enrichment_cache
    rules:

      # ── Cache hit ratio — computed via rate() division per ARCHITECTURE.md's
      # own guidance (never a server-computed ratio gauge).
      - alert: AuthzEnrichmentCacheHitRatioLow
        expr: |
          sum(rate(authz_cache_hits_total{job="iam-authz-enrichment"}[15m]))
            /
          sum(rate(authz_cache_lookups_total{job="iam-authz-enrichment"}[15m]))
          < 0.5
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-authz-enrichment ae:ctx cache hit ratio below 50%
          description: >-
            The ae:ctx/ae:tenant cache hit ratio over the last 15 minutes is
            {{ $value | humanizePercentage }}. A sustained low ratio increases
            Org & Membership (I-8) call volume and decision latency — check for
            a recent mass cache eviction (bulk membership/tenant event), a TTL
            misconfiguration, or Valkey eviction pressure/capacity issues.

  - name: iam_authz_enrichment_consumers
    rules:

      # ── SQS consumer stuck: persistent ReceiveMessage errors ─────────────────
      # platform-events retries ReceiveMessage forever internally and never
      # surfaces the error back to the caller — sqs_receive_errors_total is
      # the only externally-observable signal. The receive-error watchdog in
      # cmd/server/receive_watchdog.go already pushes to fatalErr after 6
      # consecutive polls (~3 minutes at 30s intervals), causing a pod restart.
      # This alert catches a rising error count before the watchdog fires and is
      # also useful if the watchdog itself is not running (e.g. during startup).
      - alert: AuthzEnrichmentSQSReceiveErrors
        expr: |
          increase(sqs_receive_errors_total{job="iam-authz-enrichment"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: iam-authz-enrichment SQS consumer ReceiveMessage errors
          description: >-
            sqs_receive_errors_total for queue {{ $labels.queue }} has increased
            in the last 5 minutes. This typically means the queue URL is wrong,
            IAM permissions were revoked, or the queue was deleted. Cache
            eviction events are not being received — stale authorization context
            will persist until TTL expiry. The receive-error watchdog will restart
            the pod after ~3 minutes of sustained failure; check SQS permissions
            and queue configuration. Queue: {{ $labels.queue }}.

      # ── DLQ messages arrived: a handler exhausted all retries ─────────────────
      # A message in the DLQ means its handler failed on all 5 deliveries
      # (maxReceiveCount=5 redrive policy). For cache-eviction consumers this
      # means a role/membership/tender change was NOT applied — stale context
      # persists until the key's TTL expires. For TenderRestricted (ae:restricted
      # has no TTL by design) a missed event permanently disables the tender-ACL
      # overlay for that tender until a pod restart re-processes the SQS backlog
      # or the key is manually deleted. Page immediately.
      - alert: AuthzEnrichmentDLQMessageArrived
        expr: |
          increase(platform_dlq_messages_total{job="iam-authz-enrichment"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: iam-authz-enrichment consumer sent a message to the DLQ
          description: >-
            A message on queue {{ $labels.queue }} (event type {{ $labels.event_type }})
            exhausted all 5 delivery attempts and was moved to the DLQ.
            The corresponding cache eviction was NOT applied. For TenderRestricted
            events, the tender-ACL overlay for that tender is permanently disabled
            until the key is manually cleared or the pod restarts. Inspect the DLQ,
            fix the root cause, and replay the message.
            Queue: {{ $labels.queue }}, Event: {{ $labels.event_type }}.
