asyncapi: 3.0.0

info:
  title: AuthZ Enrichment Service — Events
  version: "1.0.0"
  description: |
    Event contract for `iam-authz-enrichment`, the platform's Envoy
    `ext_authz` v3 Policy Decision Point (PDP).

    This service is **receive-only** on the event bus: it consumes 15 event
    types across five independent SQS queues and publishes **zero**
    events — it has no state changes of its own to announce
    (`internal/adapter/inbound/consumer`'s own package doc: "This service
    consumes only — it publishes nothing"). There is no outbox table, no
    SNS/EventBridge producer, and no database of any kind — every event
    received is a cache-invalidation trigger against this service's own
    Valkey cache (LLD §6, §7), never a domain state mutation of its own.

    Producers, one set of event types per queue:

      Queue                 Producer(s)                            Events
      ──────────────────────────────────────────────────────────────────
      membership-authz-q    Org & Membership (iam-org-membership)   6
      user-authz-q          User Profile (iam-user-profile)         3
      billing-authz-q       Billing Service                         3
      tenant-authz-q        Realm Provisioner                       2
      tender-authz-q        Tender Service                          1

    This service owns none of these schemas — every message definition below
    is consumer-side documentation of an upstream contract, kept in sync
    with the producer, not the source of truth for it (the same convention
    `iam-tender-acl`'s own asyncapi.yaml already established for its two
    consumed event types). Where the producer's own published asyncapi.yaml
    was directly available (Org & Membership's `membership-authz-q` events,
    User Profile's `user-authz-q` events), the schemas below were verified
    against it field-for-field. Where it was not (Billing Service, Realm
    Provisioner, Tender Service — no asyncapi.yaml available in this
    workspace), the schemas below reflect only what this service's own code
    actually reads, explicitly flagged per-message below.

    Idempotency: unlike every other IAM service, this service has **no
    database**, so there is no `processed_events` table. Idempotency is
    instead a Valkey `SET NX` on `ae:processed:{event_id}` (7-day TTL,
    matching the SQS message-lifetime convention) — the functional
    equivalent of `INSERT ... ON CONFLICT DO NOTHING` for a service with
    nothing to insert into (LLD §7.6). A handler failure explicitly evicts
    the just-set marker (`EvictProcessed`) so a genuinely-failing message
    still counts toward `maxReceiveCount` and reaches its DLQ, instead of
    being falsely treated as already-processed on redelivery.

    Wire format: a producer with its Glue registry configured (every IAM
    sibling) Glue-encodes `data` — base64 of [0x03][0x00][16-byte schema
    version UUID] + JSON — and sets `dataschema`. This service strips that
    self-describing header (GlueDecoder) without any Glue client or
    registry of its own; a plain-JSON envelope passes through untouched.

    DLQ: all five queues follow the identical, purely SQS-native
    convention — `maxReceiveCount=5` before a message lands in its own
    `-dlq`, configured on the queue resource itself
    (`scripts/init-localstack.sh`), never in application code. A
    dead-letter handler only logs each message's 5th and last delivery
    (it never acks). Note `TenderRestricted`'s `ae:restricted` fact has no
    TTL, so a DLQ'd one stays stale until it is replayed. Because
    every event here is a cache-invalidation trigger rather than a state
    mutation, a DLQ'd message degrades to "this cache entry may be stale
    until its TTL naturally expires" (5–60s, LLD §6.1) rather than a
    correctness failure requiring replay (LLD §7.7).
  x-consumer-behavior:
    DepartmentMembershipGranted:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
    DepartmentMembershipRevoked:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
    DepartmentMembershipLevelChanged:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
    TenantRoleGranted:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
    TenantRoleRevoked:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
    MembershipRevoked:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
        - "Best-effort evict every ae:tender_acl:{tenant}:*:{user} entry"
      publishes_events: false
      note: >-
        LLD §16 AE-20 — Org & Membership's per-user removal cascade signal.
        A full member removal soft-deletes the tenant_memberships row and
        leaves the user's per-grant rows inert rather than firing
        DepartmentMembershipRevoked/TenantRoleRevoked individually, so this
        is the only membership-authz-q event that fires on a whole-
        membership removal — and gets a wider eviction than the other five
        as a result. The tender-ACL eviction is best-effort: a failure logs
        a warning but never fails the event (a partial scan degrades to
        "stale until its 15s TTL expires", not a correctness failure).
    UserUpdated:
      on_receipt:
        - "If changed_fields includes \"email\": evict ae:ctx:{tenant}:{user} + ae:neg:{tenant}:{user}"
        - "Any other changed_fields value: no-op"
      publishes_events: false
      note: >-
        The only membership/user-queue event with a payload-content filter —
        every other event type here evicts unconditionally on receipt.
    UserAvailabilityChanged:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
      publishes_events: false
      note: >-
        Historically evicted because a user's active_delegations[] rode the
        I-8 projection and availability changes shifted delegation state;
        the delegations extraction (LLD §16 AE-18) dropped that field from
        I-8 entirely, so this eviction is no longer load-bearing for any
        authz fact — retained unconditionally rather than turned into a
        no-op, since evicting an already-fresh key is harmless and removing
        the subscription entirely is a separate, not-yet-made decision.
    UserDeleted:
      on_receipt:
        - "Evict ae:ctx:{tenant}:{user}"
        - "Evict ae:neg:{tenant}:{user}"
        - "Best-effort evict every ae:tender_acl:{tenant}:*:{user} entry"
      publishes_events: false
    TenantPlanChanged:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
    TenantSubscriptionCancelled:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
    TenantReactivated:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
    TenantSuspended:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
      note: >-
        Realm Provisioner RP-14 (operator emergency lockout) and billing-lapse
        suspension path. Without this eviction, ae:tenant would continue serving
        stale subscription_status/read_only values for up to AE_TENANT_TTL (~60s)
        after the tenant is suspended, allowing read and mutation requests through
        during the suspension window. Billing-lapse suspension is also covered by
        TenantSubscriptionCancelled on billing-authz-q from Billing directly;
        operator-initiated suspension (RP-14) has no billing event, so this is
        the only eviction path for that case.
    TenantReactivated:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
      note: >-
        Realm Provisioner RP-10 operator-sourced reactivation (source=operator).
        Distinct from the billing-authz-q TenantReactivated (source=billing from
        Billing Service) — that one arrives on billing-authz-q and is handled by
        billingHandler. This handler covers only the operator path on
        tenant-authz-q, closing the eviction gap for operator-reactivated tenants
        that would otherwise stay stale until AE_TENANT_TTL.
    TenantOffboarded:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
      note: >-
        Realm Provisioner offboarding path. Evicting ae:tenant ensures no further
        Allow decisions are served for an offboarded tenant on reads from the
        tenant-scoped slice after the realm is deleted in Keycloak. The next
        Check for any user in that tenant will call Org & Membership, receive
        domain.ErrNotFound for the missing tenant, and deny.
    TrialExpired:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
      note: >-
        Realm Provisioner RP-C1 (trial-expiry CronJob). A trial expiry changes
        the tenant's subscription_status and read_only flag — without eviction,
        the ae:tenant cache would continue to serve the pre-expiry values for up
        to AE_TENANT_TTL, allowing mutation requests that should be read-only-gated.
    TrialReactivated:
      on_receipt:
        - "Evict ae:tenant:{tenant} (single key — no payload decode needed beyond the envelope's own tenant_id)"
      publishes_events: false
      note: >-
        Realm Provisioner RP-10 trial reactivation (new trial_ends_at). Evicts
        ae:tenant so the fresh subscription_status and new trial end date are
        picked up on the next Check rather than served from the expired snapshot.
    TenantConverted:
      on_receipt:
        - "Update the in-process realm→tenant map (realm from payload → this event's tenant_id)"
        - "Evict ae:tenant:{tenant}"
      publishes_events: false
      note: >-
        Realm strategy changed (shared → dedicated), so the tenant-scoped
        cache slice is stale and the realm map needs the new mapping for
        future JWT `iss`-based tenant resolution (LLD §8.3).
    TenantRealmReady:
      on_receipt:
        - "Update the in-process realm→tenant map (realm from payload → this event's tenant_id) — NO cache eviction"
      publishes_events: false
      note: >-
        Wiring this (not just TenantConverted) matters because both events
        must reach this consumer to keep the realm→tenant map correct for
        all provisioning paths. Both RP-2 (direct-paid signup) and RP-3
        (trial→dedicated conversion) always emit TenantRealmReady followed
        by TenantConverted in the same outbox transaction — the filter on
        tenant-authz-q MUST include both event types. With only
        TenantConverted in the filter, HandleTenantRealmReady is never
        invoked, and any future RP path that emits TenantRealmReady without
        TenantConverted would leave the realm map un-updated, causing
        DENY_UNRESOLVABLE_SUBJECT for all users in that realm. The note in
        an earlier revision of this spec that said "direct-paid signup fires
        only TenantRealmReady" was incorrect — RP-2 has always emitted both.
    TenderRestricted:
      on_receipt:
        - "Flip the in-memory restricted-tender fact for (tenant, tender) — NOT a cache eviction"
      publishes_events: false
      note: >-
        The only event in this document that doesn't touch Valkey at all —
        RestrictedTenderSet is a plain in-process map, independently held
        per replica (every replica consumes every queue, LLD §3.4), rebuilt
        from scratch on pod restart by whatever backlog of TenderRestricted
        events SQS still has undelivered.

defaultContentType: application/json

tags:
  - $ref: "#/components/tags/consumed"
  - $ref: "#/components/tags/published"

servers:
  membershipAuthZQueue:
    host: sqs.amazonaws.com
    protocol: sqs
    description: >-
      AWS SQS queue `membership-authz-q`, consumed by this service.
      Companion dead-letter queue `membership-authz-q-dlq` receives
      messages after `maxReceiveCount=5` failed processing attempts
      (`scripts/init-localstack.sh`). Reachable only internally
      (VPC endpoint / mesh-restricted).
    bindings:
      sqs:
        queueUrl: "https://sqs.ap-south-1.amazonaws.com/000000000000/membership-authz-q"

  userAuthZQueue:
    host: sqs.amazonaws.com
    protocol: sqs
    description: >-
      AWS SQS queue `user-authz-q`, consumed by this service. Companion
      dead-letter queue `user-authz-q-dlq` receives messages after
      `maxReceiveCount=5` failed processing attempts.
    bindings:
      sqs:
        queueUrl: "https://sqs.ap-south-1.amazonaws.com/000000000000/user-authz-q"

  billingAuthZQueue:
    host: sqs.amazonaws.com
    protocol: sqs
    description: >-
      AWS SQS queue `billing-authz-q`, consumed by this service. Companion
      dead-letter queue `billing-authz-q-dlq` receives messages after
      `maxReceiveCount=5` failed processing attempts.
    bindings:
      sqs:
        queueUrl: "https://sqs.ap-south-1.amazonaws.com/000000000000/billing-authz-q"

  tenantAuthZQueue:
    host: sqs.amazonaws.com
    protocol: sqs
    description: >-
      AWS SQS queue `tenant-authz-q`, consumed by this service. Companion
      dead-letter queue `tenant-authz-q-dlq` receives messages after
      `maxReceiveCount=5` failed processing attempts.
    bindings:
      sqs:
        queueUrl: "https://sqs.ap-south-1.amazonaws.com/000000000000/tenant-authz-q"

  tenderAuthZQueue:
    host: sqs.amazonaws.com
    protocol: sqs
    description: >-
      AWS SQS queue `tender-authz-q`, consumed by this service. Companion
      dead-letter queue `tender-authz-q-dlq` receives messages after
      `maxReceiveCount=5` failed processing attempts.
    bindings:
      sqs:
        queueUrl: "https://sqs.ap-south-1.amazonaws.com/000000000000/tender-authz-q"

channels:
  membership-authz-q:
    address: membership-authz-q
    title: Membership and role events (AuthZ Enrichment consumer)
    description: >-
      Six event types, all evicting the per-user ae:ctx slice; MembershipRevoked
      additionally evicts ae:tender_acl (§16 AE-20).
    servers:
      - $ref: "#/servers/membershipAuthZQueue"
    messages:
      DepartmentMembershipGranted:
        $ref: "#/components/messages/DepartmentMembershipGranted"
      DepartmentMembershipRevoked:
        $ref: "#/components/messages/DepartmentMembershipRevoked"
      DepartmentMembershipLevelChanged:
        $ref: "#/components/messages/DepartmentMembershipLevelChanged"
      TenantRoleGranted:
        $ref: "#/components/messages/TenantRoleGranted"
      TenantRoleRevoked:
        $ref: "#/components/messages/TenantRoleRevoked"
      MembershipRevoked:
        $ref: "#/components/messages/MembershipRevoked"
    bindings:
      sqs:
        queue:
          name: membership-authz-q
          fifoQueue: false
        deadLetterQueue:
          name: membership-authz-q-dlq
          maxReceiveCount: 5

  user-authz-q:
    address: user-authz-q
    title: User lifecycle events (AuthZ Enrichment consumer)
    description: >-
      Three event types from User Profile. UserUpdated evicts only when
      "email" is in changed_fields; UserAvailabilityChanged and UserDeleted
      evict unconditionally, the latter also best-effort-evicting
      ae:tender_acl.
    servers:
      - $ref: "#/servers/userAuthZQueue"
    messages:
      UserUpdated:
        $ref: "#/components/messages/UserUpdated"
      UserAvailabilityChanged:
        $ref: "#/components/messages/UserAvailabilityChanged"
      UserDeleted:
        $ref: "#/components/messages/UserDeleted"
    bindings:
      sqs:
        queue:
          name: user-authz-q
          fifoQueue: false
        deadLetterQueue:
          name: user-authz-q-dlq
          maxReceiveCount: 5

  billing-authz-q:
    address: billing-authz-q
    title: Billing / subscription events (AuthZ Enrichment consumer)
    description: >-
      Three event types, all evicting the same single tenant-scoped key
      (ae:tenant:{tenant}) regardless of which fired — no payload decode
      needed beyond the envelope's own tenant_id.
    servers:
      - $ref: "#/servers/billingAuthZQueue"
    messages:
      TenantPlanChanged:
        $ref: "#/components/messages/TenantPlanChanged"
      TenantSubscriptionCancelled:
        $ref: "#/components/messages/TenantSubscriptionCancelled"
      TenantReactivated:
        $ref: "#/components/messages/TenantReactivated"
    bindings:
      sqs:
        queue:
          name: billing-authz-q
          fifoQueue: false
        deadLetterQueue:
          name: billing-authz-q-dlq
          maxReceiveCount: 5

  tenant-authz-q:
    address: tenant-authz-q
    title: Tenant realm and lifecycle events (AuthZ Enrichment consumer)
    description: >-
      Seven event types from iam-realm-provisioner via the iam-tenant-events
      SNS topic, split into two families:

      Realm-map family (TenantConverted, TenantRealmReady): keep the
      in-process realm→tenant map fresh for JWT-issuer-based tenant resolution
      (LLD §8.3). TenantConverted additionally evicts ae:tenant (realm strategy
      changed — context is stale). Both MUST be in the SNS filter — the Realm
      Provisioner always co-emits them together for RP-2 and RP-3.

      Lifecycle family (TenantSuspended, TenantReactivated, TenantOffboarded,
      TrialExpired, TrialReactivated): evict ae:tenant so the next Check fetches
      fresh tenant context rather than serving stale subscription_status,
      read_only, or plan values. No payload decode — the envelope's own
      tenant_id drives the eviction. Note: TenantReactivated here is the
      operator-sourced one (RP-10, source=operator); the billing-sourced
      TenantReactivated is handled separately on billing-authz-q.
    servers:
      - $ref: "#/servers/tenantAuthZQueue"
    messages:
      TenantConverted:
        $ref: "#/components/messages/TenantConverted"
      TenantRealmReady:
        $ref: "#/components/messages/TenantRealmReady"
      TenantSuspended:
        $ref: "#/components/messages/TenantSuspended"
      TenantReactivatedOperator:
        $ref: "#/components/messages/TenantReactivatedOperator"
      TenantOffboarded:
        $ref: "#/components/messages/TenantOffboarded"
      TrialExpired:
        $ref: "#/components/messages/TrialExpired"
      TrialReactivated:
        $ref: "#/components/messages/TrialReactivated"
    bindings:
      sqs:
        queue:
          name: tenant-authz-q
          fifoQueue: false
        deadLetterQueue:
          name: tenant-authz-q-dlq
          maxReceiveCount: 5
      sns:
        consumers:
          - protocol: sqs
            endpoint:
              url: "https://sqs.ap-south-1.amazonaws.com/000000000000/tenant-authz-q"
            filterPolicy:
              type:
                - TenantConverted
                - TenantRealmReady
                - TenantSuspended
                - TenantReactivated
                - TenantOffboarded
                - TrialExpired
                - TrialReactivated
            filterPolicyScope: MessageAttributes

  tender-authz-q:
    address: tender-authz-q
    title: Tender restriction events (AuthZ Enrichment consumer)
    description: >-
      One event type. Flips an in-process fact (not a cache eviction) that
      the §3.1 step-4 tender-ACL overlay reads to decide whether a
      tender-scoped request needs the overlay check at all.
    servers:
      - $ref: "#/servers/tenderAuthZQueue"
    messages:
      TenderRestricted:
        $ref: "#/components/messages/TenderRestricted"
    bindings:
      sqs:
        queue:
          name: tender-authz-q
          fifoQueue: false
        deadLetterQueue:
          name: tender-authz-q-dlq
          maxReceiveCount: 5

operations:
  receiveMembershipAuthZ:
    action: receive
    channel:
      $ref: "#/channels/membership-authz-q"
    title: Receive membership and role events
    summary: Evict per-user membership cache on department/role grants, revokes, and whole-membership removal.
    description: >-
      Receives any of six event types from membership-authz-q and, if the
      envelope's event id has not already been marked processed
      (ae:processed:{event_id} — SET NX, §7.6), evicts ae:ctx:{tenant}:{user}
      and ae:neg:{tenant}:{user} for the affected user. MembershipRevoked
      additionally best-effort-evicts every ae:tender_acl entry for that
      user (§16 AE-20). There are no `send` operations anywhere in this
      document — this service publishes nothing.
    messages:
      - $ref: "#/channels/membership-authz-q/messages/DepartmentMembershipGranted"
      - $ref: "#/channels/membership-authz-q/messages/DepartmentMembershipRevoked"
      - $ref: "#/channels/membership-authz-q/messages/DepartmentMembershipLevelChanged"
      - $ref: "#/channels/membership-authz-q/messages/TenantRoleGranted"
      - $ref: "#/channels/membership-authz-q/messages/TenantRoleRevoked"
      - $ref: "#/channels/membership-authz-q/messages/MembershipRevoked"

  receiveUserAuthZ:
    action: receive
    channel:
      $ref: "#/channels/user-authz-q"
    title: Receive user lifecycle events
    summary: Evict per-user membership cache on an email change, availability change, or account deletion.
    description: >-
      Receives any of three event types from user-authz-q. UserUpdated
      evicts only when changed_fields includes "email" (a consumer-side
      filter, not an SNS attribute filter); UserAvailabilityChanged and
      UserDeleted evict unconditionally. UserDeleted additionally
      best-effort-evicts every ae:tender_acl entry for that user.
    messages:
      - $ref: "#/channels/user-authz-q/messages/UserUpdated"
      - $ref: "#/channels/user-authz-q/messages/UserAvailabilityChanged"
      - $ref: "#/channels/user-authz-q/messages/UserDeleted"

  receiveBillingAuthZ:
    action: receive
    channel:
      $ref: "#/channels/billing-authz-q"
    title: Receive billing / subscription events
    summary: Evict the tenant-scoped cache slice on a plan change, cancellation, or reactivation.
    description: >-
      Receives any of three event types from billing-authz-q and evicts
      ae:tenant:{tenant} — a single key, regardless of which of the three
      fired, since all three affect the same tenant-scoped cache slice
      (plan, feature_flags, subscription_status, read_only).
    messages:
      - $ref: "#/channels/billing-authz-q/messages/TenantPlanChanged"
      - $ref: "#/channels/billing-authz-q/messages/TenantSubscriptionCancelled"
      - $ref: "#/channels/billing-authz-q/messages/TenantReactivated"

  receiveTenantAuthZ:
    action: receive
    channel:
      $ref: "#/channels/tenant-authz-q"
    title: Receive tenant realm and lifecycle events
    summary: Keep the realm→tenant map current and evict ae:tenant on any Realm Provisioner lifecycle change.
    description: >-
      Receives seven event types from tenant-authz-q. Realm-map events
      (TenantConverted, TenantRealmReady) update the in-process realm→tenant
      map; TenantConverted additionally evicts ae:tenant:{tenant}. Lifecycle
      events (TenantSuspended, TenantReactivated, TenantOffboarded,
      TrialExpired, TrialReactivated) evict ae:tenant:{tenant} only — no
      payload decode, driven entirely by the envelope's own tenant_id.
    messages:
      - $ref: "#/channels/tenant-authz-q/messages/TenantConverted"
      - $ref: "#/channels/tenant-authz-q/messages/TenantRealmReady"
      - $ref: "#/channels/tenant-authz-q/messages/TenantSuspended"
      - $ref: "#/channels/tenant-authz-q/messages/TenantReactivatedOperator"
      - $ref: "#/channels/tenant-authz-q/messages/TenantOffboarded"
      - $ref: "#/channels/tenant-authz-q/messages/TrialExpired"
      - $ref: "#/channels/tenant-authz-q/messages/TrialReactivated"

  receiveTenderAuthZ:
    action: receive
    channel:
      $ref: "#/channels/tender-authz-q"
    title: Receive tender restriction events
    summary: Flip the in-process restricted-tender fact the tender-ACL overlay reads.
    description: >-
      Receives TenderRestricted and marks (tenant, tender) restricted in
      an in-process set — not a Valkey write. The §3.1 step-4 tender-ACL
      overlay only calls out to the Tender ACL Service (TAC-4) for a tender
      this set marks restricted; every other tender-scoped request skips
      the overlay entirely.
    messages:
      - $ref: "#/channels/tender-authz-q/messages/TenderRestricted"

components:
  tags:
    consumed:
      name: consumed
      description: >-
        This service is the consumer, not the producer, for every message
        carrying this tag. Canonical schema ownership sits with the
        producing service — these definitions are this service's
        consumer-side documentation, kept in sync with upstream, not the
        source of truth for it.
    published:
      name: published
      description: >-
        This service publishes zero events — no message in this document
        carries this tag. Declared for symmetry with every sibling
        service's asyncapi.yaml (the same convention iam-tender-acl's
        asyncapi.yaml already established), and so a Published/Consumed
        viewer has somewhere to render a message if that ever changes,
        which as of this revision it never has: this is, and is designed
        to remain, a pure event sink.

  messages:
    DepartmentMembershipGranted:
      name: DepartmentMembershipGranted
      title: Department Membership Granted
      summary: A user was granted membership in a department at a given level.
      tags:
        - $ref: "#/components/tags/consumed"
      contentType: application/json
      payload:
