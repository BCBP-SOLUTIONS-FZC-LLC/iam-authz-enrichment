            tenant_id: "a0f2a3c4-1111-4a2b-9c3d-000000000000"
            time: "2026-08-26T03:28:00Z"
            data:
              realm: "acme-corp"
      x-consumer-schema-dependency:
        # Confirmed against Realm Provisioner's own api/asyncapi.yaml
        # (TenantRealmReadyPayload: realm: {type: string}) — matches
        # exactly. That payload also carries tenant_id/keycloak_shard/
        # oidc_clients, all ignored by this service.
        depends-on-shape:
          realm: "string — the dedicated realm identifier, used as the JWT iss claim for tenant resolution (LLD §8.3)"
        producer-lifecycle-status: stable

    TenderRestricted:
      name: TenderRestricted
      title: Tender Restricted
      summary: A tender was flagged restricted, requiring the tender-ACL overlay check for view/edit/approve actions on it.
      tags:
        - $ref: "#/components/tags/consumed"
      contentType: application/json
      payload:
        $ref: "#/components/schemas/TenderRestrictedPayload"
      examples:
        - name: TenderRestrictedExample
          summary: A typical TenderRestricted event envelope.
          payload:
            id: "018f4c3e-a1b2-7000-9d3e-4f8c1a2b3d5c"
            type: "TenderRestricted"
            tenant_id: "a0f2a3c4-1111-4a2b-9c3d-000000000000"
            time: "2026-08-26T03:29:00Z"
            data:
              tender_id: "b1c2d3e4-6666-4f7a-8b9c-000000000004"
      x-consumer-schema-dependency:
        # No published asyncapi.yaml was available for the producer
        # (Tender Service) in this workspace to verify against. Reflects
        # only usecase.TenderRestrictedPayload, the shape this service's
        # own code (HandleTenderRestricted) actually decodes.
        #
        # LLD §16 AE-32 (CF-4): this event's existence and its routing to
        # AuthZ Enrichment ARE confirmed — directly against IAM HLD v1.41
        # §9.4/§10.3, which catalogs exactly three tender.events types
        # (TenderRestricted, TenderAccessGranted, TenderSectionApproved)
        # and assigns only this one here, the other two to Audit Log only.
        # producer-lifecycle-status stays `unknown` because that flag is
        # specifically about the PAYLOAD wire-shape below, which still has
        # no Tender Service asyncapi.yaml to verify against — a narrower,
        # still-open gap distinct from the event-catalog question CF-4 asked.
        depends-on-shape:
          tender_id: "uuid — the tender being flagged restricted"
        producer-lifecycle-status: unknown

  schemas:
    DepartmentMembershipGrantedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - tenant_id
        - department_id
        - level
        - actor_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user granted the department membership. This service's only consumed field.
        tenant_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        level:
          type: string
          enum: [preparator, reviewer, approver]
        actor_id:
          type: string
          format: uuid

    DepartmentMembershipRevokedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - tenant_id
        - department_id
        - actor_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user whose department membership was revoked. This service's only consumed field.
        tenant_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid

    DepartmentMembershipLevelChangedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - tenant_id
        - department_id
        - previous_level
        - new_level
        - actor_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user whose department level changed. This service's only consumed field.
        tenant_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        previous_level:
          type: string
          enum: [preparator, reviewer, approver]
        new_level:
          type: string
          enum: [preparator, reviewer, approver]
        actor_id:
          type: string
          format: uuid

    TenantRoleGrantedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - tenant_id
        - role_code
        - actor_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user granted the tenant-level role. This service's only consumed field.
        tenant_id:
          type: string
          format: uuid
        role_code:
          type: string
          enum: [tenant_owner, tenant_admin, tender_admin]
        actor_id:
          type: string
          format: uuid

    TenantRoleRevokedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - tenant_id
        - role_code
        - actor_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The user whose tenant-level role was revoked. This service's only consumed field.
        tenant_id:
          type: string
          format: uuid
        role_code:
          type: string
          enum: [tenant_owner, tenant_admin, tender_admin]
        actor_id:
          type: string
          format: uuid

    MembershipRevokedPayload:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - user_id
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: The user removed from the tenant (source of the cascade). This service's only consumed field.
        actor_id:
          type: string
          format: uuid
          description: >-
            Principal that performed the removal. Optional — absent for
            system-driven removals where no HTTP actor context is
            available.

    UserUpdatedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - changed_fields
      properties:
        user_id:
          type: string
          format: uuid
          description: This service's only unconditionally-consumed field.
        changed_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: >-
            Names of the user fields that changed. This service checks
            only for the presence of "email" in this array; every other
            value (of the 17 possible fleet-wide) is a no-op here.
        email:
          type: string
          format: email
          description: New email value, present only when email changed. Read only when changed_fields includes "email".

    UserAvailabilityChangedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - status
      properties:
        user_id:
          type: string
          format: uuid
          description: This service's only consumed field.
        status:
          type: string
          enum: [available, busy, ooo]

    UserDeletedPayload:
      type: object
      additionalProperties: true
      required:
        - user_id
        - deleted_at
      properties:
        user_id:
          type: string
          format: uuid
          description: This service's only consumed field.
        deleted_at:
          type: string
          format: date-time

    EnvelopeOnlyPayload:
      type: object
      additionalProperties: true
      description: >-
        No payload fields are decoded for this event type — the eviction
        (ae:tenant:{tenant}) is driven entirely by the envelope's own
        top-level tenant_id field, common to every event this service
        consumes. The producer may send an arbitrary data body; this
        service ignores all of it.

    TenantRealmEventPayload:
      type: object
      additionalProperties: true
      required:
        - realm
      properties:
        realm:
          type: string
          description: >-
            The dedicated realm identifier. Used as the key in this
            service's in-process realm→tenant map, matched against a JWT's
            iss claim during tenant resolution (LLD §8.3).

    TenderRestrictedPayload:
      type: object
      additionalProperties: true
      required:
        - tender_id
      properties:
        tender_id:
          type: string
          format: uuid
          description: >-
            The tender being flagged restricted. Recorded in this service's
            in-process RestrictedTenderSet, keyed by (tenant, tender_id)
            using the envelope's own tenant_id.
